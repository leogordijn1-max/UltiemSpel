name: Shadow Survivor gameplay tests

on:
  push:
    branches:
      - main
      - feature/living-world-prototype
      - feature/update-4-weapons-evolutions
      - feature/update-5-enemies-waves-bosses
      - feature/update-6-final-boss-endless
      - feature/update-7-characters-progression
      - feature/update-8-ui-polish-statistics
  pull_request:
    branches:
      - main
      - feature/living-world-prototype
      - feature/update-4-weapons-evolutions

permissions:
  contents: read

jobs:
  gameplay:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript syntax
        run: |
          for file in js/*.js tests/*.test.js tests/*.test.cjs; do
            node --check "$file"
          done
      - name: Run gameplay regression tests
        run: node --test tests/*.test.js tests/*.test.cjs
